# .github/workflows/release.yml
#
# Release pipeline for queue-ti-java-client
#
# Triggers: any tag push matching v* (e.g. v2026.05.0, v2026.05.0-preview.4).
# Responsibilities:
#   1. Build and run the full test suite — never publish a broken artifact.
#   2. Derive the library version from the tag (strip leading "v").
#   3. Publish the JAR to GitHub Packages (Maven).
#   4. Create a GitHub Release, attach the JAR, and set pre-release / latest
#      flags based on whether the tag contains a hyphen.
#
# Required secrets (all provided automatically by GitHub Actions):
#   GITHUB_TOKEN — used for GitHub Packages auth and release creation.
#
# Required repository settings:
#   Actions > General > Workflow permissions: "Read and write permissions"
#   (or the explicit permissions block below is sufficient on repos that allow
#   per-workflow permission grants).

name: Release

on:
  push:
    tags:
      - 'v*'

# No concurrency group — tags are unique; two pushes of the same tag cannot
# race, and we never want to cancel a release mid-flight.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write   # create GitHub Releases and upload assets
  packages: write   # publish to GitHub Packages (Maven)

jobs:
  release:
    name: Build, Publish & Release
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so any git-describe or changelog tooling has context.
          fetch-depth: 0

      # ── Java + Gradle cache ───────────────────────────────────────────────
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Caches both ~/.gradle/wrapper and ~/.gradle/caches keyed on
          # build files; no separate cache action needed.
          cache: gradle

      # ── Derive version from tag ───────────────────────────────────────────
      # Strip the leading "v" so Gradle receives a plain semver/calver string.
      # Tag v2026.05.0-preview.4 → version 2026.05.0-preview.4
      # Tag v2026.05.0           → version 2026.05.0
      - name: Derive version from tag
        id: version
        run: |
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # A tag is a pre-release if the version part (after "v") contains a
          # hyphen, e.g. "2026.05.0-preview.4".  Stable tags have no hyphen.
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true"  >> "$GITHUB_OUTPUT"
          fi

      # ── Build & test ──────────────────────────────────────────────────────
      # Pass the derived version via -Pversion so the published artifact carries
      # the correct coordinates without touching build.gradle.kts.
      - name: Build and run tests
        run: ./gradlew build -PreleaseVersion=${{ steps.version.outputs.version }}

      # Upload the HTML test report on failure so it can be inspected from the
      # Actions UI without a local checkout.
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/
            spring-boot-starter/build/reports/tests/
            spring-integration/build/reports/tests/
          retention-days: 7

      # ── Publish to GitHub Packages ────────────────────────────────────────
      # GitHub Packages rejects re-uploads of any file within an already-claimed
      # version with HTTP 409 — even if the prior run only uploaded the POM.
      # Treat 409 as "already published" so retries are idempotent.
      - name: Publish main artifact
        run: |
          set +e
          OUT=$(./gradlew publish -PreleaseVersion=${{ steps.version.outputs.version }} 2>&1)
          EXIT=$?
          set -e
          echo "$OUT"
          if [ $EXIT -ne 0 ] && echo "$OUT" | grep -q "409"; then
            echo "Main artifact already published (HTTP 409) — skipping."
            exit 0
          fi
          exit $EXIT
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Spring Boot starter artifact
        run: |
          set +e
          OUT=$(./gradlew :spring-boot-starter:publish -PreleaseVersion=${{ steps.version.outputs.version }} 2>&1)
          EXIT=$?
          set -e
          echo "$OUT"
          if [ $EXIT -ne 0 ] && echo "$OUT" | grep -q "409"; then
            echo "Spring Boot starter already published (HTTP 409) — skipping."
            exit 0
          fi
          exit $EXIT
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Spring Integration artifact
        run: |
          set +e
          OUT=$(./gradlew :spring-integration:publish -PreleaseVersion=${{ steps.version.outputs.version }} 2>&1)
          EXIT=$?
          set -e
          echo "$OUT"
          if [ $EXIT -ne 0 ] && echo "$OUT" | grep -q "409"; then
            echo "Spring Integration artifact already published (HTTP 409) — skipping."
            exit 0
          fi
          exit $EXIT
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Upload JARs as workflow artifacts ─────────────────────────────────
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: |
            build/libs/*.jar
            spring-boot-starter/build/libs/*.jar
            spring-integration/build/libs/*.jar
          retention-days: 30

      # ── Create GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          PRERELEASE="${{ steps.version.outputs.prerelease }}"
          MAKE_LATEST="${{ steps.version.outputs.make_latest }}"

          PRERELEASE_FLAG=""
          [ "$PRERELEASE" = "true" ] && PRERELEASE_FLAG="--prerelease"

          LATEST_FLAG="--latest"
          [ "$MAKE_LATEST" = "false" ] && LATEST_FLAG="--latest=false"

          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG already exists — updating assets."
            gh release edit "$TAG" --title "$TAG" $PRERELEASE_FLAG $LATEST_FLAG \
              --generate-notes \
              --repo "${{ github.repository }}"
            gh release upload "$TAG" \
              build/libs/*.jar spring-boot-starter/build/libs/*.jar spring-integration/build/libs/*.jar \
              --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" \
              build/libs/*.jar spring-boot-starter/build/libs/*.jar spring-integration/build/libs/*.jar \
              --title "$TAG" $PRERELEASE_FLAG $LATEST_FLAG \
              --generate-notes \
              --repo "${{ github.repository }}"
          fi
