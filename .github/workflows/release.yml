# .github/workflows/release.yml
#
# Release pipeline for queue-ti-java-client
#
# Triggers: any tag push matching v* (e.g. v2026.05.0, v2026.05.0-preview.4).
# Responsibilities:
#   1. Build and run the full test suite — never publish a broken artifact.
#   2. Derive the library version from the tag (strip leading "v").
#   3. Publish the JAR to GitHub Packages (Maven).
#   4. Create a GitHub Release, attach the JAR, and set pre-release / latest
#      flags based on whether the tag contains a hyphen.
#
# Required secrets (all provided automatically by GitHub Actions):
#   GITHUB_TOKEN — used for GitHub Packages auth and release creation.
#
# Required repository settings:
#   Actions > General > Workflow permissions: "Read and write permissions"
#   (or the explicit permissions block below is sufficient on repos that allow
#   per-workflow permission grants).

name: Release

on:
  push:
    tags:
      - 'v*'

# No concurrency group — tags are unique; two pushes of the same tag cannot
# race, and we never want to cancel a release mid-flight.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write   # create GitHub Releases and upload assets
  packages: write   # publish to GitHub Packages (Maven)

jobs:
  release:
    name: Build, Publish & Release
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so any git-describe or changelog tooling has context.
          fetch-depth: 0

      # ── Java + Gradle cache ───────────────────────────────────────────────
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Caches both ~/.gradle/wrapper and ~/.gradle/caches keyed on
          # build files; no separate cache action needed.
          cache: gradle

      # ── Derive version from tag ───────────────────────────────────────────
      # Strip the leading "v" so Gradle receives a plain semver/calver string.
      # Tag v2026.05.0-preview.4 → version 2026.05.0-preview.4
      # Tag v2026.05.0           → version 2026.05.0
      - name: Derive version from tag
        id: version
        run: |
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # A tag is a pre-release if the version part (after "v") contains a
          # hyphen, e.g. "2026.05.0-preview.4".  Stable tags have no hyphen.
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true"  >> "$GITHUB_OUTPUT"
          fi

      # ── Build & test ──────────────────────────────────────────────────────
      # Pass the derived version via -Pversion so the published artifact carries
      # the correct coordinates without touching build.gradle.kts.
      - name: Build and run tests
        run: ./gradlew build -PreleaseVersion=${{ steps.version.outputs.version }}

      # Upload the HTML test report on failure so it can be inspected from the
      # Actions UI without a local checkout.
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/
          retention-days: 7

      # ── Publish to GitHub Packages ────────────────────────────────────────
      # GitHub Packages Maven does not allow overwriting an existing version
      # (HTTP 409). Skip the publish step if the version is already present so
      # that pipeline retries don't fail here after a partial first run.
      - name: Check if version already published
        id: pkg_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE="https://maven.pkg.github.com/Joessst-Dev/queue-ti-java-client/de/joesst/dev"
          CODE_MAIN=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "${BASE}/queue-ti-java-client/${VERSION}/queue-ti-java-client-${VERSION}.jar")
          CODE_STARTER=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "${BASE}/queue-ti-spring-boot-starter/${VERSION}/queue-ti-spring-boot-starter-${VERSION}.jar")
          echo "Main: HTTP $CODE_MAIN  Starter: HTTP $CODE_STARTER"
          if [ "$CODE_MAIN" = "200" ] && [ "$CODE_STARTER" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Both artifacts already published for $VERSION — skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "One or both artifacts missing for $VERSION — will publish."
          fi

      - name: Publish to GitHub Packages
        if: steps.pkg_check.outputs.already_published == 'false'
        run: ./gradlew publish :spring-boot-starter:publish -PreleaseVersion=${{ steps.version.outputs.version }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Upload JARs as workflow artifacts ─────────────────────────────────
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: |
            build/libs/*.jar
            spring-boot-starter/build/libs/*.jar
          retention-days: 30

      # ── Create GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          PRERELEASE="${{ steps.version.outputs.prerelease }}"
          MAKE_LATEST="${{ steps.version.outputs.make_latest }}"

          PRERELEASE_FLAG=""
          [ "$PRERELEASE" = "true" ] && PRERELEASE_FLAG="--prerelease"

          LATEST_FLAG="--latest"
          [ "$MAKE_LATEST" = "false" ] && LATEST_FLAG="--latest=false"

          JARS="build/libs/*.jar spring-boot-starter/build/libs/*.jar"

          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG already exists — updating assets."
            gh release edit "$TAG" --title "$TAG" $PRERELEASE_FLAG $LATEST_FLAG \
              --generate-notes \
              --repo "${{ github.repository }}"
            gh release upload "$TAG" $JARS --clobber \
              --repo "${{ github.repository }}"
          else
            gh release create "$TAG" $JARS \
              --title "$TAG" $PRERELEASE_FLAG $LATEST_FLAG \
              --generate-notes \
              --repo "${{ github.repository }}"
          fi
